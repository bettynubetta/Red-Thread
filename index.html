<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c15"><link rel="manifest" href="manifest.webmanifest"><title>Red Thread</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090c15;color:#edf0f7;font-family:system-ui,sans-serif}
#board{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;top:0;left:0;right:0;padding:18px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.title{font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.status{font-size:12px;color:#aab2c4}
.panel{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;background:rgba(16,20,32,.94);border:1px solid #2a3142;border-radius:20px;padding:12px}
textarea{display:block;width:100%;height:82px;background:transparent;border:0;outline:0;resize:none;color:#edf0f7;font:16px/1.45 system-ui;padding:4px}
textarea::placeholder{color:#778197}.nudge{display:none;border-left:2px solid #d34b5c;margin:3px 0 10px;padding:7px 10px;font-size:14px;color:#dfe4ee}
.row{display:flex;gap:7px;flex-wrap:wrap}button{border:1px solid #30394e;background:#1a2131;color:#edf0f7;border-radius:12px;padding:10px 13px;font:600 14px system-ui}
.primary{background:#c94658;border-color:#c94658}.active{outline:2px solid #d96a77}.small{font-size:12px;color:#9da6b9;margin-top:8px}
</style></head><body>
<canvas id="board"></canvas><div class="top"><div class="title">Red Thread</div><div id="status" class="status">Ready</div></div>
<div class="panel"><textarea id="input" placeholder="Start with whatever is in your head..."></textarea><div id="nudge" class="nudge"></div>
<div class="row"><button id="voice" class="primary">Talk</button><button id="add">Add thought</button><button id="quiet">Don't interrupt</button><button id="clear">Clear</button></div>
<div class="small">Your thoughts are saved on this device.</div></div>
<script>
const input=document.getElementById('input'),board=document.getElementById('board'),ctx=board.getContext('2d'),status=document.getElementById('status'),nudge=document.getElementById('nudge'),voice=document.getElementById('voice'),quietBtn=document.getElementById('quiet');
let thoughts=[];let quiet=false;let nudgeTimer=null;let recognition=null;let listening=false;
try{thoughts=JSON.parse(localStorage.getItem('red-thread-thoughts')||'[]')}catch(e){thoughts=[]}
function save(){localStorage.setItem('red-thread-thoughts',JSON.stringify(thoughts))}
function resize(){const d=devicePixelRatio||1;board.width=innerWidth*d;board.height=innerHeight*d;board.style.width=innerWidth+'px';board.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);draw()}
function addThought(text){text=text.trim();if(!text)return;const a=Math.random()*Math.PI*2,r=70+Math.random()*Math.min(innerWidth,innerHeight)*.28;thoughts.push({text,x:innerWidth/2+Math.cos(a)*r,y:innerHeight*.38+Math.sin(a)*r*.62,created:Date.now()});save();input.value='';nudge.style.display='none';draw()}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=0;i<thoughts.length;i++)for(let j=i+1;j<thoughts.length;j++){const a=thoughts[i],b=thoughts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<240){ctx.strokeStyle='rgba(185,197,222,'+(0.14*(1-d/240))+')';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}thoughts.forEach(t=>{ctx.beginPath();ctx.arc(t.x,t.y,5,0,Math.PI*2);ctx.fillStyle='#d44c5c';ctx.shadowColor='#d44c5c';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#e4e8f1';ctx.font='13px system-ui';ctx.fillText(t.text.length>42?t.text.slice(0,42)+'…':t.text,t.x+11,t.y+4)})}
document.getElementById('add').onclick=()=>addThought(input.value);
input.addEventListener('input',()=>{clearTimeout(nudgeTimer);nudge.style.display='none';if(quiet||!input.value.trim())return;nudgeTimer=setTimeout(()=>{const p=['What made that thought come up?','Keep following that thread.','What happened next?','Is there something connected to that?','You can stay with that thought for a minute.'];nudge.textContent=p[Math.floor(Math.random()*p.length)];nudge.style.display='block'},4500)});
quietBtn.onclick=()=>{quiet=!quiet;quietBtn.classList.toggle('active',quiet);quietBtn.textContent=quiet?'Listening mode ON':"Don't interrupt";status.textContent=quiet?'Quiet until you turn it off.':'Ready';if(quiet)nudge.style.display='none'};
document.getElementById('clear').onclick=()=>{if(confirm('Clear all thoughts saved on this device?')){thoughts=[];save();draw()}};
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;
recognition.onstart=()=>{listening=true;voice.textContent='Stop talking';status.textContent='Listening…'};
recognition.onend=()=>{listening=false;voice.textContent='Talk';if(!quiet)status.textContent='Ready'};
recognition.onerror=e=>{listening=false;voice.textContent='Talk';status.textContent=e.error==='not-allowed'?'Microphone permission denied.':'Voice error: '+e.error};
recognition.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)s+=e.results[i][0].transcript+' ';if(s){input.value+=(input.value?' ':'')+s.trim();input.dispatchEvent(new Event('input'))}};
voice.onclick=()=>{try{listening?recognition.stop():recognition.start()}catch(e){}}}
else{voice.textContent='Voice unavailable';voice.disabled=true;status.textContent='Type a thought to begin.'}
addEventListener('resize',resize);resize();
</script></body></html>
